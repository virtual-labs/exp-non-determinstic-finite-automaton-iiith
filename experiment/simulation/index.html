<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DFA Language Acceptance - Automata Theory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="mobile-detection.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: '#3B82F6', // blue-500
            secondary: '#6366F1', // indigo-500
            accent: '#10B981', // green-500
            danger: '#EF4444', // red-500
            neutral: '#F3F4F6', // gray-100
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #fff;
      min-height: 100vh;
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
      /* Make body use all available height */
      height: 100vh;
    }
    .glass-morphism {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    
    .dark-glass {
      background: rgba(243, 244, 246, 0.7); /* gray-100 */
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #3B82F6, #6366F1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .floating-card {
      transform: translateY(0);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .floating-card:hover {
      transform: translateY(-0.25rem);
      box-shadow: 0 1.25rem 2.5rem rgba(59, 130, 246, 0.08);
    }
    
    .neu-button {
      background: #fff;
      color: #374151;
      border: 1px solid #e5e7eb;
      box-shadow: 0 0.125rem 0.5rem rgba(59, 130, 246, 0.06);
      transition: all 0.2s ease;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.75rem 1.5rem !important;
      min-width: 110px;
      min-height: 2.5rem;
      border-radius: 0.9rem !important;
    }
    .neu-button.primary {
      background: #3B82F6;
      color: #fff;
      border: none;
    }
    .neu-button.secondary {
      background: #6366F1;
      color: #fff;
      border: none;
    }
    .neu-button.accent {
      background: #10B981;
      color: #fff;
      border: none;
    }
    .neu-button.danger {
      background: #EF4444;
      color: #fff;
      border: none;
    }
    .neu-button:hover {
      filter: brightness(0.95);
      box-shadow: 0 0.25rem 1rem rgba(59, 130, 246, 0.10);
    }
    .neu-button:active {
      filter: brightness(0.90);
    }
    /* Responsive grid for main panels */
    #main-panels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 1024px) {
      #main-panels {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
    #dfa-diagram-container {
      grid-column: span 2;
    }
    @media (max-width: 1024px) {
      #dfa-diagram-container {
        grid-column: span 1;
      }
    }
    #input-panel, #trace-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .panel-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }
    #input_container {
      background: #F3F4F6;
      border-radius: 0.75rem;
      padding: 1rem;
      color: #1e293b;
      font-size: 1.5rem;
      text-align: center;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100vw;
      overflow-x: auto;
    }
    .input-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
    }
    #trace-container {
      background: #F3F4F6;
      border-radius: 0.75rem;
      padding: 1rem;
      backdrop-filter: blur(6px);
      overflow-y: auto;
      max-height: 30vh;
      min-height: 10vh;
    }
    #stack_list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #stack_list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #e5e7eb;
    }
    #stack_list li:last-child {
      border-bottom: none;
    }
    /* Responsive tweaks for panels and diagram */
    .max-w-7xl {
      max-width: 100vw;
      padding-left: 0.5vw;
      padding-right: 0.5vw;
    }
    .rounded-2xl, .rounded-3xl {
      border-radius: 0.75rem;
    }
    @media (max-width: 768px) {
      .rounded-2xl, .rounded-3xl {
        border-radius: 0.75rem;
      }
      .floating-card, .glass-morphism, .dark-glass {
        padding: 0.75rem !important;
        margin-bottom: 0.5rem !important;
      }
      .max-w-7xl {
        padding-left: 0.5vw;
        padding-right: 0.5vw;
      }
      #input_container {
        font-size: 1rem !important;
        padding: 0.5rem !important;
        min-height: 1.5rem !important;
      }
      #trace-container {
        max-height: 15vh !important;
        min-height: 0 !important;
        padding: 0.5rem !important;
      }
      #canvas1 {
        height: 32vw !important;
        min-height: 80px !important;
        max-height: 120px !important;
      }
    }
    /* Make SVG diagram responsive */
    #canvas1 {
      width: 100vw !important;
      max-width: 100%;
      height: 35vw !important;
      min-height: 180px;
      max-height: 320px;
      display: block;
      margin: auto;
    }
    @media (max-width: 768px) {
      #canvas1 {
        height: 45vw !important;
        min-height: 120px;
        max-height: 220px;
      }
    }
    /* Responsive footer */
    footer {
      width: 100vw;
      max-width: 100vw;
      padding-left: 2vw;
      padding-right: 2vw;
    }
    /* Make all text dark for better visibility */
    body, .text-gray-800, .text-gray-700, .text-black, .panel-title, h2, h3, span, p, label, .font-semibold, .font-medium, .font-bold, .font-mono, .font-sans, .font-inter {
      color: #18181b !important;
    }
    .bg-neutral, .dark-glass, .glass-morphism {
      color: #18181b !important;
    }
    /* Remove any text-white or light text overrides */
    .text-white, .text-gray-100, .text-gray-200, .text-gray-300, .text-gray-400, .text-gray-500, .text-gray-600 {
      color: #18181b !important;
    }
    /* Button text color override for contrast */
    .neu-button.primary, .neu-button.secondary, .neu-button.accent, .neu-button.danger {
      color: #fff !important;
    }
    /* For step numbers in Quick Guide, keep white for contrast */
    .w-6.bg-primary .text-white, .w-6.bg-secondary .text-white, .w-6.bg-accent .text-white, .w-6.bg-danger .text-white {
      color: #fff !important;
    }
    /* Make main control buttons fatter (taller and wider) */
    .neu-button {
      padding: 0.75rem 1.5rem !important;
      font-size: 1.05rem !important;
      min-width: 110px;
      min-height: 2.5rem;
      border-radius: 0.9rem !important;
    }
    .neu-button svg {
      width: 1.15em;
      height: 1.15em;
    }
    /* Slightly increase gap between buttons for clarity */
    .flex.flex-wrap.gap-2, .flex.flex-wrap.md\:gap-2 {
      gap: 0.75rem !important;
    }
  </style>
</head>
<body class="text-gray-800 overflow-x-hidden bg-white">

  <!-- Quick Guide Panel (Compact) -->
  <div class="floating-card glass-morphism rounded-2xl p-4 shadow-lg max-w-7xl mx-auto mb-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-gray-800 flex items-center">
        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zm-2 5a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
        Quick Guide
      </h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="dark-glass rounded-xl p-3 text-center">
        <div class="w-6 h-6 bg-primary rounded-full flex items-center justify-center mx-auto mb-2">
          <span class="text-white font-bold text-xs">1</span>
        </div>
        <p class="text-gray-700 text-xs">Select a DFA using "Change DFA"</p>
      </div>
      <div class="dark-glass rounded-xl p-3 text-center">
        <div class="w-6 h-6 bg-secondary rounded-full flex items-center justify-center mx-auto mb-2">
          <span class="text-white font-bold text-xs">2</span>
        </div>
        <p class="text-gray-700 text-xs">Choose an input string</p>
      </div>
      <div class="dark-glass rounded-xl p-3 text-center">
        <div class="w-6 h-6 bg-accent rounded-full flex items-center justify-center mx-auto mb-2">
          <span class="text-white font-bold text-xs">3</span>
        </div>
        <p class="text-gray-700 text-xs">Step through character by character</p>
      </div>
      <div class="dark-glass rounded-xl p-3 text-center">
        <div class="w-6 h-6 bg-danger rounded-full flex items-center justify-center mx-auto mb-2">
          <span class="text-white font-bold text-xs">4</span>
        </div>
        <p class="text-gray-700 text-xs">Watch the result: accept or reject</p>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 pb-16 flex flex-col lg:flex-row gap-8 items-stretch min-h-[70vh]" style="min-height:70vh;align-items:stretch;">
    <!-- Primary Control Panel and DFA Visualization Side by Side -->
    <div class="flex-1 flex flex-col gap-6 justify-between min-w-0">
      <!-- Input String & State Diagram Combined Panel -->
      <div class="floating-card glass-morphism rounded-3xl p-4 mb-6 shadow-xl flex flex-col gap-3">
        <div class="flex flex-col md:flex-row md:items-end gap-3">
          <div class="flex-1">
            <div class="dark-glass rounded-2xl p-3 flex flex-col md:flex-row md:items-center gap-3">
              <div class="flex-1">
                <h3 class="text-base font-semibold text-gray-800 mb-1 flex items-center">
                  <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  Input String
                </h3>
                <div class="bg-neutral rounded-xl p-2 backdrop-blur-sm">
                  <div id="input_container" class="text-xl font-mono font-bold text-black text-center tracking-wider min-h-[2rem] flex items-center justify-center"></div>
                </div>
              </div>
              <div class="flex flex-wrap gap-2 md:gap-2 justify-end md:justify-start">
                <button id="change_dfa" class="neu-button primary px-2 py-1 rounded-xl font-medium text-xs transition-all hover:scale-105 active:scale-95 flex items-center gap-1">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"></path>
                  </svg>
                  Change DFA
                </button>
                <button id="change_input" class="neu-button secondary px-2 py-1 rounded-xl font-medium text-xs transition-all hover:scale-105 active:scale-95 flex items-center gap-1">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path>
                  </svg>
                  Change Input
                </button>
                <button id="prev" class="neu-button accent px-2 py-1 rounded-xl font-medium text-xs transition-all hover:scale-105 active:scale-95 flex items-center gap-1">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                  </svg>
                  Previous
                </button>
                <button id="next" class="neu-button danger px-2 py-1 rounded-xl font-medium text-xs transition-all hover:scale-105 active:scale-95 flex items-center gap-1">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                  </svg>
                  Next Step
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- DFA Visualization Panel (merged, compact) -->
        <div class="dark-glass rounded-2xl p-3 flex-1 flex flex-col justify-between min-h-[220px] mt-2">
          <div id="DFA_description_container" class="mb-2">
            <div class="bg-gradient-to-r from-primary/10 to-secondary/10 rounded-xl p-2 border border-gray-200">
              <span id="DFA_description" class="text-black font-medium text-sm">Select a DFA to start</span>
            </div>
          </div>
          <h3 class="text-base font-semibold text-gray-800 mb-2 flex items-center">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6 6V5a3 3 0 013-3h2a3 3 0 013 3v1h2a2 2 0 012 2v3.57A22.952 22.952 0 0110 13a22.95 22.95 0 01-8-1.43V8a2 2 0 012-2h2zm2-1a1 1 0 011-1h2a1 1 0 011 1v1H8V5zm1 5a1 1 0 011-1h.01a1 1 0 110 2H10a1 1 0 01-1-1z" clip-rule="evenodd"></path>
            </svg>
            State Diagram
          </h3>
          <div class="bg-neutral rounded-xl p-2 backdrop-blur-sm flex-1 flex items-center justify-center min-h-[180px]">
            <svg id="canvas1" width="100%" height="180" class="rounded-lg bg-white shadow-inner" style="display:block; margin:auto;"></svg>
          </div>
        </div>
      </div>
      <!-- End Combined Panel -->
    </div>
    <!-- Execution Trace Sidebar -->
    <div class="lg:w-80 w-full mt-6 lg:mt-0 flex-shrink-0">
      <div class="dark-glass rounded-2xl p-6 h-full flex flex-col justify-between min-h-[340px]">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2v1a1 1 0 001 1h6a1 1 0 001-1V3a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
          </svg>
          Execution Trace
        </h3>
        <div class="bg-neutral rounded-xl p-4 backdrop-blur-sm flex-1">
          <ul id="stack_list" class="space-y-2 max-h-64 overflow-y-auto scrollbar-thin scrollbar-thumb-gray-200 scrollbar-track-transparent"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="Acceptance DFA.js"></script>
  <script>
    // Patch: Ensure input string numbers and DFA description are always black
    function refreshInput() {
      const inputContainer = document.getElementById("input_container");
      clearElem(inputContainer);
      // Ensure the input string is always visible and scrollable
      inputContainer.style.whiteSpace = "nowrap";
      inputContainer.style.overflowX = "auto";
      inputContainer.style.width = "100%";
      inputContainer.style.display = "block";
      
      // CORRECTED: Use automata instead of dfa
      const inputStr = automata[automataIndex]["input"][inputIndex]["string"];
      
      for (let i = 0; i < inputStr.length; ++i) {
        let className = "input-char font-bold text-black transition-all duration-300 transform";
        if (inputPointer == i) className += " bg-yellow-200 rounded";
        const span = document.createElement("span");
        span.id = `text_${i}`;
        span.className = className;
        span.style.margin = "0 0.25rem";
        span.textContent = inputStr[i];
        inputContainer.appendChild(span);
      }
    }
    function resetInput() {
      inputIndex = 0;
      inputPointer = -1;
      refreshInput();
    }
  </script>
</body>
</html>
